name: CI

# Corre a verificação de qualidade em cada push e pull request.
# Trava a classe de bugs que o build/lint/auditor apanham antes de chegarem ao utilizador.
on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint · Test · Build · Auditor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Testes (Vitest)
        run: npm test

      - name: Build
        # Valores fictícios — o build não contacta o Supabase (páginas dinâmicas).
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

      - name: Auditoria EEOS
        run: node audit-exodoflow-full.mjs

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Histórico completo — varre TODOS os commits, não só o último.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rls-isolation:
    name: Isolamento multi-tenant (RLS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Sobe o stack local e aplica TODAS as migrações 0001→N de raiz (valida
      # também que o conjunto de migrações aplica limpo — caminho de deploy).
      # 'supabase start' aplica migrações + seed; mais fiável que 'db start' em CI.
      - name: Iniciar Supabase local
        run: supabase start

      # Corre o teste de isolamento: Tenant A não lê nem escreve dados do Tenant B.
      - name: Teste de isolamento RLS
        run: |
          docker exec -i "$(docker ps --filter name=supabase_db -q | head -1)" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/rls-isolation.test.sql | tee /tmp/rls.out
          grep -q "ISOLAMENTO OK" /tmp/rls.out
